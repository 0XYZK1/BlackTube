plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing credentials live in keystore.properties (never committed).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.nexus.videoclient'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexus.blacktube"
        minSdk 26
        targetSdk 34
        versionCode 20
        versionName "2.10.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile", "blacktube-release.jks"))
                storePassword keystoreProps.getProperty("storePassword", "")
                keyAlias keystoreProps.getProperty("keyAlias", "blacktube")
                keyPassword keystoreProps.getProperty("keyPassword", "")
            }
        }
    }

    buildTypes {
        release {
            // Without a local keystore.properties the release build falls back to
            // the debug key, so contributors can still build and install the app.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Netzwerk + Bilder (inkl. CircleCrop)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil:2.7.0'

    // Native Wiedergabe (100% werbefrei)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // HLS-Support für YouTube Livestreams
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'

    // Native LAME encoder for real MP3 export (arm64-v8a + armeabi-v7a + x86)
    implementation('com.github.naman14:TAndroidLame:1.1') {
        // The old POM pulls in legacy com.android.support artifacts that clash with AndroidX
        transitive = false
    }

    // Stream-Auflösung (n-sig, PO-Token, Original-Audiospur-Erkennung)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.27.1'

    // Native Google Cast (Geräte in der Nähe wie in YouTube)
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
}
